# Replaces the default server of nginx/nginx-unprivileged.
# 8081 because the lab-presenter api sidecar in the pod already uses 8080.
# absolute_redirect off keeps the port out of the directory redirects
# (/1 -> /1/) that the ALB forwards to the browser.
server {
    listen       8081;
    server_name  localhost;
    absolute_redirect off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }
}
